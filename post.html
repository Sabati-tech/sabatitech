<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SabatiTech · Discussion</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#04040f;--bg2:#080818;--bg3:#0e0e24;--bg4:#13132e;--blue:#4f8ef7;--cyan:#00e5ff;--purple:#7c3aed;--green:#00ff88;--red:#ff3b3b;--yellow:#fbbf24;--text:#e8eaf6;--muted:#6b7280;--border:rgba(79,142,247,0.12);--fd:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh}
/* NAV */
.nav{height:52px;background:rgba(4,4,15,0.96);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:50;backdrop-filter:blur(20px)}
.logo{font-family:var(--fd);font-weight:800;font-size:1rem;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:0.5rem}
.logo-icon{width:26px;height:26px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.8rem}
.logo span{color:var(--cyan)}
.nav-right{display:flex;align-items:center;gap:0.8rem}
/* BACK */
.back-link{display:inline-flex;align-items:center;gap:0.4rem;color:var(--muted);text-decoration:none;font-size:0.82rem;padding:0.4rem 0;transition:color 0.2s;margin-bottom:1.5rem}
.back-link:hover{color:var(--cyan)}
/* LAYOUT */
.container{max-width:780px;margin:0 auto;padding:2rem 1.5rem}
/* POST CARD */
.post-card{background:var(--bg3);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.5rem}
.post-card-inner{display:flex;gap:0}
/* VOTE COLUMN */
.vote-col{display:flex;flex-direction:column;align-items:center;padding:1.2rem 0.8rem;gap:0.2rem;background:rgba(255,255,255,0.02);border-right:1px solid var(--border);min-width:52px}
.vote-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0.3rem;border-radius:5px;transition:all 0.2s;line-height:1}
.vote-btn:hover{color:var(--cyan);background:rgba(0,229,255,0.08)}
.vote-btn.up-active{color:var(--green)}
.vote-btn.down-active{color:var(--red)}
.vote-score{font-family:var(--fm);font-size:0.88rem;font-weight:700;color:var(--text)}
/* POST BODY */
.post-body{padding:1.3rem;flex:1;min-width:0}
.post-meta{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.8rem;flex-wrap:wrap}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0}
.author{font-weight:600;font-size:0.85rem}
.role-badge{font-size:0.65rem;font-family:var(--fm);font-weight:700;padding:0.15rem 0.45rem;border-radius:4px}
.role-admin{background:rgba(255,59,59,0.1);color:var(--red);border:1px solid rgba(255,59,59,0.2)}
.role-pro{background:rgba(79,142,247,0.1);color:var(--blue);border:1px solid rgba(79,142,247,0.2)}
.role-membre{background:rgba(107,114,128,0.1);color:var(--muted);border:1px solid rgba(107,114,128,0.15)}
.post-time{font-size:0.75rem;color:var(--muted)}
.canal-tag{font-family:var(--fm);font-size:0.7rem;color:var(--cyan);background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.15);padding:0.15rem 0.5rem;border-radius:4px}
.pin-tag{font-size:0.75rem}
.post-title{font-family:var(--fd);font-size:1.3rem;font-weight:800;line-height:1.3;margin-bottom:0.8rem}
.post-text{font-size:0.9rem;color:#b0b8cc;line-height:1.75;margin-bottom:0.8rem;white-space:pre-wrap}
.tags{display:flex;gap:0.35rem;flex-wrap:wrap;margin-bottom:0.8rem}
.tag{font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:100px;background:rgba(79,142,247,0.07);color:var(--blue);border:1px solid rgba(79,142,247,0.15);font-family:var(--fm)}
.post-footer{display:flex;align-items:center;gap:1rem;padding-top:0.8rem;border-top:1px solid rgba(255,255,255,0.05)}
.stat{font-size:0.78rem;color:var(--muted)}
.share-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.78rem;transition:color 0.2s;margin-left:auto}
.share-btn:hover{color:var(--cyan)}
/* ADMIN DELETE */
.admin-del{background:rgba(255,59,59,0.08);border:1px solid rgba(255,59,59,0.15);color:var(--red);font-size:0.75rem;padding:0.25rem 0.6rem;border-radius:5px;cursor:pointer;transition:all 0.2s}
.admin-del:hover{background:rgba(255,59,59,0.15)}
/* REPLIES */
.replies-section{margin-bottom:2rem}
.replies-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.replies-title{font-family:var(--fd);font-size:1rem;font-weight:700}
.replies-count{font-family:var(--fm);font-size:0.75rem;color:var(--muted)}
.reply-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;margin-bottom:0.7rem;transition:border-color 0.2s}
.reply-card:hover{border-color:rgba(79,142,247,0.2)}
.reply-meta{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap}
.reply-text{font-size:0.88rem;color:#b0b8cc;line-height:1.7;white-space:pre-wrap}
.reply-actions{display:flex;align-items:center;gap:0.8rem;margin-top:0.6rem}
.reply-like{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.78rem;display:flex;align-items:center;gap:0.3rem;transition:color 0.2s;padding:0}
.reply-like:hover{color:var(--green)}
.reply-like.liked{color:var(--green)}
/* REPLY FORM */
.reply-form{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:1.5rem}
.reply-form-title{font-family:var(--fd);font-size:0.88rem;font-weight:700;margin-bottom:0.8rem}
.reply-textarea{width:100%;background:var(--bg4);border:1px solid var(--border);color:var(--text);padding:0.8rem;border-radius:8px;font-family:var(--fb);font-size:0.88rem;resize:vertical;min-height:90px;transition:border-color 0.2s}
.reply-textarea:focus{outline:none;border-color:var(--blue)}
.reply-form-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.7rem;flex-wrap:wrap;gap:0.5rem}
.char-count{font-size:0.72rem;color:var(--muted);font-family:var(--fm)}
.btn-reply{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;border:none;padding:0.55rem 1.3rem;border-radius:8px;font-weight:700;font-size:0.85rem;font-family:var(--fd);cursor:pointer;transition:all 0.2s}
.btn-reply:hover{opacity:0.85;transform:translateY(-1px)}
.btn-reply:disabled{opacity:0.4;cursor:not-allowed;transform:none}
/* NOT LOGGED */
.login-prompt{background:rgba(79,142,247,0.05);border:1px solid rgba(79,142,247,0.15);border-radius:12px;padding:1.2rem;text-align:center;margin-bottom:1.5rem}
.login-prompt p{font-size:0.88rem;color:var(--muted);margin-bottom:0.7rem}
.btn-login{display:inline-flex;align-items:center;gap:0.4rem;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;text-decoration:none;padding:0.5rem 1.2rem;border-radius:8px;font-weight:700;font-size:0.82rem;font-family:var(--fd)}
/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid rgba(0,229,255,0.3);color:var(--cyan);padding:0.6rem 1.4rem;border-radius:100px;font-size:0.82rem;font-weight:600;font-family:var(--fm);z-index:999;transition:transform 0.3s}
.toast.show{transform:translateX(-50%) translateY(0)}
/* LOADING */
.loading{text-align:center;padding:3rem;color:var(--muted)}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo"><div class="logo-icon">🖥️</div>Sabati<span>Tech</span></a>
  <div class="nav-right" id="nav-right">
    <a href="communaute.html" style="color:var(--muted);font-size:0.82rem;text-decoration:none">← Communauté</a>
  </div>
</nav>

<div class="container">
  <a href="communaute.html" class="back-link">← Retour à la communauté</a>
  <div id="main-content"><div class="loading">Chargement...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SURL='https://kneplbraxjwgjwwwybtq.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuZXBsYnJheGp3Z2p3d3d5YnRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMjAxMjUsImV4cCI6MjA4NzU5NjEyNX0.3n4uBidTVkYdfPadaQFoTbV6wP1H8f-pC3BPUJLYz7Y';
let sb, user, profile, post, replies=[], myVotes={};

// Get post ID from URL
const urlParams = new URLSearchParams(window.location.search);
const postId = parseInt(urlParams.get('id'));

async function init(){
  sb = supabase.createClient(SURL,SKEY);
  const {data:{session}} = await sb.auth.getSession();
  if(session?.user){
    user = session.user;
    const {data} = await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
    profile = data;
  }
  renderNav();
  if(!postId){ document.getElementById('main-content').innerHTML='<div class="loading">Post introuvable</div>'; return; }
  await loadPost();
}

function renderNav(){
  if(user && profile){
    const av = profile.avatar_emoji||'😊';
    const bg = profile.avatar_color||'linear-gradient(135deg,#4f8ef7,#7c3aed)';
    const nm = profile.username||'';
    document.getElementById('nav-right').innerHTML = `
      <a href="communaute.html" style="color:var(--muted);font-size:0.82rem;text-decoration:none">← Communauté</a>
      <div style="display:flex;align-items:center;gap:0.5rem;background:var(--bg3);border:1px solid var(--border);border-radius:100px;padding:0.25rem 0.7rem 0.25rem 0.25rem">
        <div style="width:24px;height:24px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;font-size:0.8rem">${av}</div>
        <span style="font-size:0.78rem;font-weight:600">${nm}</span>
      </div>`;
  }
}

async function loadPost(){
  // Load post
  const {data:p} = await sb.from('posts')
    .select('*, profiles(username,avatar_emoji,avatar_color,role), canaux(slug)')
    .eq('id',postId).maybeSingle();
  if(!p){ document.getElementById('main-content').innerHTML='<div class="loading">Post introuvable ou supprimé.</div>'; return; }
  post = p;

  // Load votes for post
  const {data:votes} = await sb.from('votes').select('*').eq('post_id',postId);
  const voteScore = (votes||[]).reduce((s,v)=>s+v.value,0);
  const myVote = user ? (votes||[]).find(v=>v.user_id===user.id) : null;

  // Load replies
  const {data:reps} = await sb.from('replies')
    .select('*, profiles(username,avatar_emoji,avatar_color,role)')
    .eq('post_id',postId)
    .order('created_at',{ascending:true});
  replies = reps||[];

  // Update title
  document.title = `${p.title} — SabatiTech`;

  renderAll(p, voteScore, myVote?.value||0);
}

function renderAll(p, score, myVoteVal){
  const pv = p.profiles;
  const init = (pv?.username?.[0]||'?').toUpperCase();
  const roleCls = pv?.role==='admin'?'role-admin':pv?.role==='pro'?'role-pro':'role-membre';
  const roleLabel = pv?.role==='admin'?'Admin':pv?.role==='pro'?'Pro':'Membre';
  const tagsHtml = (p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
  const isAdmin = profile?.role==='admin';
  const upCls = myVoteVal===1?'up-active':'';
  const downCls = myVoteVal===-1?'down-active':'';

  const postHtml = `
  <div class="post-card">
    <div class="post-card-inner">
      <div class="vote-col">
        <button class="vote-btn ${upCls}" onclick="vote(1)" title="Intéressant">▲</button>
        <span class="vote-score" id="vote-score">${score}</span>
        <button class="vote-btn ${downCls}" onclick="vote(-1)" title="Pas intéressant">▼</button>
      </div>
      <div class="post-body">
        <div class="post-meta">
          <div class="av" style="background:${pv?.avatar_color||'linear-gradient(135deg,#4f8ef7,#7c3aed)'}">${pv?.avatar_emoji||init}</div>
          <span class="author">${pv?.username||'Anonyme'}</span>
          <span class="role-badge ${roleCls}">${roleLabel}</span>
          <span class="post-time">${timeAgo(p.created_at)}</span>
          ${p.canaux?`<span class="canal-tag">#${p.canaux.slug}</span>`:''}
          ${p.pinned?'<span class="pin-tag">📌 Épinglé</span>':''}
        </div>
        <div class="post-title">${p.title}</div>
        ${p.body?`<div class="post-text">${p.body}</div>`:''}
        ${tagsHtml?`<div class="tags">${tagsHtml}</div>`:''}
        <div class="post-footer">
          <span class="stat">💬 ${replies.length} réponse${replies.length>1?'s':''}</span>
          <span class="stat">👁️ ${p.views||0} vues</span>
          <button class="share-btn" onclick="share()">🔗 Partager</button>
          ${isAdmin?`<button class="admin-del" onclick="adminDeletePost()">🗑️ Supprimer (admin)</button>`:''}
        </div>
      </div>
    </div>
  </div>`;

  // Reply form
  const formHtml = user ? `
  <div class="reply-form">
    <div class="reply-form-title">💬 Ajouter une réponse</div>
    <textarea class="reply-textarea" id="reply-input" placeholder="Écrivez votre réponse..." maxlength="1000" oninput="updateCount()"></textarea>
    <div class="reply-form-footer">
      <span class="char-count" id="char-count">0 / 1000</span>
      <button class="btn-reply" onclick="submitReply()">Répondre →</button>
    </div>
  </div>` : `
  <div class="login-prompt">
    <p>Connectez-vous pour participer à la discussion</p>
    <a href="index.html" class="btn-login">Se connecter →</a>
  </div>`;

  // Replies
  const repliesHtml = `
  <div class="replies-section">
    <div class="replies-header">
      <span class="replies-title">Réponses</span>
      <span class="replies-count">${replies.length} réponse${replies.length>1?'s':''}</span>
    </div>
    <div id="replies-list">
      ${replies.length ? replies.map(r=>renderReply(r)).join('') : '<div style="text-align:center;padding:2rem;color:var(--muted);font-size:0.88rem">Aucune réponse pour l\'instant.<br>Soyez le premier à répondre !</div>'}
    </div>
  </div>`;

  document.getElementById('main-content').innerHTML = postHtml + formHtml + repliesHtml;
}

function renderReply(r){
  const rp = r.profiles;
  const init = (rp?.username?.[0]||'?').toUpperCase();
  const roleCls = rp?.role==='admin'?'role-admin':rp?.role==='pro'?'role-pro':'role-membre';
  const roleLabel = rp?.role==='admin'?'Admin':rp?.role==='pro'?'Pro':'Membre';
  const isOwn = user && r.author_id === user.id;
  const isAdmin = profile?.role==='admin';
  const likes = r.likes||0;
  return `
  <div class="reply-card" id="reply-${r.id}">
    <div class="reply-meta">
      <div class="av" style="width:24px;height:24px;font-size:0.75rem;background:${rp?.avatar_color||'linear-gradient(135deg,#4f8ef7,#7c3aed)'}">${rp?.avatar_emoji||init}</div>
      <span class="author" style="font-size:0.82rem">${rp?.username||'Anonyme'}</span>
      <span class="role-badge ${roleCls}" style="font-size:0.6rem">${roleLabel}</span>
      <span class="post-time">${timeAgo(r.created_at)}</span>
    </div>
    <div class="reply-text">${r.body}</div>
    <div class="reply-actions">
      <button class="reply-like ${myVotes['r'+r.id]?'liked':''}" onclick="likeReply(${r.id},this)">
        ▲ <span id="rl-${r.id}">${likes}</span>
      </button>
      ${(isOwn||isAdmin)?`<button class="admin-del" onclick="deleteReply(${r.id})">🗑️</button>`:''}
    </div>
  </div>`;
}

// ── VOTE POST ──
async function vote(val){
  if(!user){ toast('Connectez-vous pour voter'); return; }
  const scoreEl = document.getElementById('vote-score');
  const {data:existing} = await sb.from('votes').select('*').eq('post_id',postId).eq('user_id',user.id).maybeSingle();

  if(existing){
    if(existing.value === val){
      // Retire le vote
      await sb.from('votes').delete().eq('id',existing.id);
    } else {
      // Change le vote
      await sb.from('votes').update({value:val}).eq('id',existing.id);
    }
  } else {
    await sb.from('votes').insert({post_id:postId, user_id:user.id, value:val});
  }
  // Recharge les votes
  const {data:votes} = await sb.from('votes').select('*').eq('post_id',postId);
  const score = (votes||[]).reduce((s,v)=>s+v.value,0);
  const myVote = (votes||[]).find(v=>v.user_id===user.id);
  if(scoreEl) scoreEl.textContent = score;
  // Update boutons
  document.querySelectorAll('.vote-btn').forEach(b=>b.classList.remove('up-active','down-active'));
  if(myVote?.value===1) document.querySelector('.vote-btn:first-child').classList.add('up-active');
  if(myVote?.value===-1) document.querySelector('.vote-btn:last-of-type').classList.add('down-active');
}

// ── REPLY ──
function updateCount(){
  const v = document.getElementById('reply-input')?.value||'';
  const el = document.getElementById('char-count');
  if(el) el.textContent = `${v.length} / 1000`;
}

async function submitReply(){
  if(!user){ toast('Connectez-vous pour répondre'); return; }
  const input = document.getElementById('reply-input');
  const text = input?.value.trim();
  if(!text){ toast('Écrivez quelque chose'); return; }
  const btn = document.querySelector('.btn-reply');
  if(btn) btn.disabled = true;

  const {error} = await sb.from('replies').insert({
    post_id: postId,
    author_id: user.id,
    body: text
  });

  if(error){ toast('Erreur: '+error.message, true); if(btn)btn.disabled=false; return; }
  if(input) input.value='';
  updateCount();
  if(btn) btn.disabled=false;
  toast('✓ Réponse publiée !');
  await loadPost();
}

// ── LIKE REPLY ──
async function likeReply(replyId, btn){
  if(!user){ toast('Connectez-vous pour liker'); return; }
  const key = 'r'+replyId;
  const liked = myVotes[key];
  const countEl = document.getElementById('rl-'+replyId);
  const current = parseInt(countEl?.textContent||0);

  if(liked){
    myVotes[key] = false;
    await sb.from('replies').update({likes: Math.max(0,current-1)}).eq('id',replyId);
    if(countEl) countEl.textContent = Math.max(0,current-1);
    btn.classList.remove('liked');
  } else {
    myVotes[key] = true;
    await sb.from('replies').update({likes: current+1}).eq('id',replyId);
    if(countEl) countEl.textContent = current+1;
    btn.classList.add('liked');
  }
}

// ── DELETE ──
async function deleteReply(id){
  if(!confirm('Supprimer cette réponse ?')) return;
  await sb.from('replies').delete().eq('id',id);
  toast('Réponse supprimée');
  await loadPost();
}

async function adminDeletePost(){
  if(!confirm('Supprimer ce post et toutes ses réponses ?')) return;
  await sb.from('replies').delete().eq('post_id',postId);
  await sb.from('votes').delete().eq('post_id',postId);
  await sb.from('posts').delete().eq('id',postId);
  toast('Post supprimé');
  setTimeout(()=>window.location.href='communaute.html',1500);
}

function share(){
  navigator.clipboard.writeText(window.location.href);
  toast('🔗 Lien copié !');
}

function timeAgo(d){
  const s=Date.now()-new Date(d).getTime(),m=Math.floor(s/60000),h=Math.floor(s/3600000),j=Math.floor(s/86400000);
  if(m<1)return"à l'instant";if(m<60)return`il y a ${m}min`;if(h<24)return`il y a ${h}h`;return`il y a ${j}j`;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.addEventListener('DOMContentLoaded',()=>{
  const go=()=>{if(typeof supabase!=='undefined')init();else setTimeout(go,100);};go();
});
</script>
</body>
</html>
